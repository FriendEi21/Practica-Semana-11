<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Inventario Django MTV{% endblock %}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f4f6f9; color: #333; }
        nav { background-color: #0f172a; padding: 1rem 2rem; display: flex; gap: 20px; }
        nav a { color: #f8fafc; text-decoration: none; font-weight: 600; }
        nav a:hover { color: #38bdf8; }
        .container { max-width: 900px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background-color: #1e293b; color: white; }
        .badge-ok { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; }
        .badge-warn { background: #fef9c3; color: #854d0e; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <nav>
        <!-- Uso estricto del tag url para evitar hardcodear rutas -->
        <a href="{% url 'home' %}">Inicio (FBV)</a>
        <a href="{% url 'catalogo' %}">Catálogo de Productos (CBV)</a>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
